<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productora</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#000;color:#fff;cursor:none;}
html{scroll-behavior:smooth;}

/* LOADER */
.loader{
position:fixed;
inset:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
z-index:3000;
transition:opacity 1s ease;
}
.loader.hidden{opacity:0;pointer-events:none;}
.loader span{
font-family:'Roboto';
font-size:28px;
opacity:.8;
letter-spacing:2px;
animation:pulse 1.5s infinite;
}
@keyframes pulse{
0%,100%{opacity:.3;}
50%{opacity:1;}
}

/* CURSOR */
.cursor{
width:18px;height:18px;
border:1px solid #fff;
border-radius:50%;
position:fixed;
pointer-events:none;
transform:translate(-50%,-50%);
z-index:2000;
}
.cursor.hover{
transform:translate(-50%,-50%) scale(1.6);
background:rgba(255,255,255,0.15);
}

/* NAV */
nav{
position:fixed;width:100%;top:0;
padding:15px 40px;
display:flex;justify-content:space-between;align-items:center;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
z-index:1000;
}
.logo{height:30px;}

nav a{
color:#fff;margin-left:20px;text-decoration:none;
opacity:0.9;transition:0.3s;
}
nav a:hover{opacity:0.6;}

/* HERO */
.hero{height:70vh;position:relative;overflow:hidden;}

.hero iframe{
position:absolute;top:50%;left:50%;
width:177.77vh;height:100vh;
transform:translate(-50%,-50%);
}

.overlay{
position:absolute;inset:0;
background:rgba(0,0,0,0.45);
z-index:1;
}

.hero-content{
position:relative;z-index:2;height:100%;
display:flex;flex-direction:column;
justify-content:center;
align-items:flex-start;
padding:0 10%;
}

/* TITULO */
.brand{
font-family:'Roboto', sans-serif;
font-weight:700;
font-style:italic;
font-size:48px;
letter-spacing:-1px;
opacity:0;
transform:translateY(40px);
animation:fadeUp 1s ease forwards;
}

.sub{
font-size:20px;margin-top:5px;opacity:0;
animation:fadeUp 1s ease forwards 0.2s;
}

.hero p{
margin-top:10px;opacity:0;
animation:fadeUp 1s ease forwards 0.4s;
}

@keyframes fadeUp{
to{opacity:1;transform:translateY(0);}
}

/* BOTÓN PRO (ARREGLADO) */
.btn{
margin-top:20px;
display:inline-block;
padding:8px 16px;
font-size:12px;
letter-spacing:0.6px;
text-decoration:none;
color:#fff;
border:1px solid rgba(255,255,255,0.4);
border-radius:999px;
background:transparent;
transition:all 0.3s ease;
position:relative;
overflow:hidden;
}
.btn::before{
content:"";
position:absolute;
top:0;left:-100%;
width:100%;height:100%;
background:linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
transition:0.6s;
}
.btn:hover::before{left:100%;}
.btn:hover{background:#fff;color:#000;}

/* SECTIONS */
section{padding:100px 10%;}

/* SCROLL */
.reveal{
opacity:0;
transform:translateY(100px) scale(0.96);
filter:blur(12px);
transition:all 1.3s cubic-bezier(0.16,1,0.3,1);
}
.reveal.active{
opacity:1;
transform:translateY(0) scale(1);
filter:blur(0);
}

/* SERVICES (NO TOCADO) */
.services-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
margin-top:30px;
}
.service-box{
border:1px solid rgba(255,255,255,0.15);
padding:25px;
background:rgba(255,255,255,0.03);
backdrop-filter:blur(8px);
transition:0.4s;
}
.service-box:hover{
transform:translateY(-10px);
border-color:#fff;
}

/* ABOUT */
.about{display:flex;flex-wrap:wrap;gap:40px;align-items:center;}
.about img{width:100%;max-width:400px;}
.about-text{max-width:600px;}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:10px;
}
.gallery img{
width:100%;height:260px;object-fit:cover;
transition:0.4s;
}
.gallery img:hover{transform:scale(1.05);}

/* PORTFOLIO */
.portfolio iframe{
width:100%;
height:280px;
margin-bottom:25px;
border:none;
}

/* CONTACT */
.contact{text-align:center;}
.contact-buttons{
margin-top:30px;
display:flex;justify-content:center;gap:15px;flex-wrap:wrap;
}

.contact-buttons a{
padding:8px 14px;
border:1px solid rgba(255,255,255,0.4);
border-radius:999px;
text-decoration:none;
color:#fff;
font-size:13px;
position:relative;
overflow:hidden;
}
.contact-buttons a::before{
content:"";
position:absolute;
top:0;left:-100%;
width:100%;height:100%;
background:linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
transition:0.6s;
}
.contact-buttons a:hover::before{left:100%;}
.contact-buttons a:hover{background:#fff;color:#000;}

/* 🔥 DIRECCIÓN CREATIVA PRO */
.creative-wrap{
display:flex;
justify-content:center;
gap:60px;
margin-top:60px;
flex-wrap:wrap;
}

.creative-item{
text-align:center;
text-decoration:none;
color:#fff;
}

.circle{
width:85px;
height:85px;
border-radius:50%;
overflow:hidden;
border:1px solid rgba(255,255,255,0.3);
transition:.4s;
}

.circle img{
width:100%;
height:100%;
object-fit:cover;
}

.circle:hover{
transform:scale(1.1);
border-color:#fff;
}

.name{
margin-top:10px;
font-size:13px;
letter-spacing:.5px;
}

.role{
font-size:11px;
opacity:.5;
}

/* MOBILE */
@media(max-width:768px){
.hero iframe{width:100vw;height:56.25vw;}
.brand{font-size:32px;}
.about{flex-direction:column;}
section{padding:70px 8%;}
}
</style>
</head>

<body>

<div class="loader"><span>Pantera Creative</span></div>
<div class="cursor"></div>

<nav>
<img src="https://i.ibb.co/FLhbXwjp/MED-COLOR-BLANCO.png" class="logo">
<div>
<a href="#about">Nosotros</a>
<a href="#services">Servicios</a>
<a href="#portfolio">Portafolio</a>
<a href="#contact">Contacto</a>
</div>
</nav>

<!-- HERO -->
<section class="hero">
<iframe src="https://player.vimeo.com/video/1183887876#t=40s&background=1&autoplay=1&loop=1&muted=1"></iframe>
<div class="overlay"></div>

<div class="hero-content">
<div class="brand">Pantera.Creative</div>
<div class="sub">Productora audiovisual</div>
<p>Contenido con intención, estética e impacto</p>
<a href="#portfolio" class="btn">Ver portafolio</a>
</div>
</section>

<!-- TODO TU CONTENIDO SIGUE EXACTAMENTE IGUAL -->
<!-- (SERVICES, ABOUT, GALLERY, PORTFOLIO NO TOCADOS) -->

<!-- CONTACT -->
<section id="contact" class="contact reveal">
<h2>Contacto</h2>

<div class="contact-buttons">
<a href="mailto:juanbiazp95@gmail.com">Correo</a>
<a href="https://wa.me/573026206880" target="_blank">WhatsApp</a>
</div>

<!-- 🔥 DIRECCIÓN CREATIVA -->
<div class="creative-wrap">

<!-- JUAN -->
<a href="LINK_INSTAGRAM_JUAN" target="_blank" class="creative-item">
<div class="circle">
<img src="LINK_IMAGEN_JUAN">
</div>
<div class="name">Juan Díaz</div>
<div class="role">Productor audiovisual</div>
</a>

<!-- DIEGO -->
<a href="LINK_INSTAGRAM_DIEGO" target="_blank" class="creative-item">
<div class="circle">
<img src="LINK_IMAGEN_DIEGO">
</div>
<div class="name">Diego Ospina</div>
<div class="role">Productor audiovisual</div>
</a>

</div>

</section>

<script>
// LOADER
window.addEventListener("load",()=>{
setTimeout(()=>document.querySelector(".loader").classList.add("hidden"),1200);
});

// SCROLL
const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add('active');
}
});
},{threshold:0.15});
document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));

// CURSOR FIX
const cursor=document.querySelector('.cursor');
window.addEventListener('mousemove',e=>{
cursor.style.top=e.clientY+'px';
cursor.style.left=e.clientX+'px';
});

// HOVER SOLO LINKS
document.querySelectorAll('a').forEach(el=>{
el.addEventListener('mouseenter',()=>cursor.classList.add('hover'));
el.addEventListener('mouseleave',()=>cursor.classList.remove('hover'));
});

// SONIDO
const clickSound=new Audio("https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3");
document.querySelectorAll("a").forEach(btn=>{
btn.addEventListener("click",()=>{clickSound.volume=0.2;clickSound.play();});
});
</script>

</body>
</html>
