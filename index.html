<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productora</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{
background:#000;
color:#fff;
cursor:none;
overflow-x:hidden;
}
html{scroll-behavior:smooth;}

/* LOADER CON LOGO */
.loader{
position:fixed;
inset:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
z-index:5000;
transition:opacity 1s ease;
}
.loader.hidden{opacity:0;pointer-events:none;}
.loader img{
width:80px;
opacity:.8;
animation:pulse 1.4s infinite;
}
@keyframes pulse{
0%,100%{opacity:.3;transform:scale(.95);}
50%{opacity:1;transform:scale(1);}
}

/* CURSOR */
.cursor{
width:18px;height:18px;
border:1px solid #fff;
border-radius:50%;
position:fixed;
pointer-events:none;
transform:translate(-50%,-50%);
transition:transform .12s ease, background .2s;
z-index:3000;
}
.cursor.hover{
transform:translate(-50%,-50%) scale(1.8);
background:rgba(255,255,255,0.15);
}

/* NAV */
nav{
position:fixed;width:100%;top:0;
padding:15px 40px;
display:flex;justify-content:space-between;align-items:center;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
z-index:2000;
}
.logo{height:30px;}

nav a{
color:#fff;margin-left:20px;text-decoration:none;
opacity:0.85;transition:0.3s;
}
nav a:hover{opacity:0.5;}

/* HERO */
.hero{height:70vh;position:relative;overflow:hidden;}

.hero iframe{
position:absolute;top:50%;left:50%;
width:177.77vh;height:100vh;
transform:translate(-50%,-50%);
pointer-events:none;
}

.overlay{
position:absolute;inset:0;
background:rgba(0,0,0,0.45);
z-index:1;
}

.hero-content{
position:relative;z-index:2;height:100%;
display:flex;flex-direction:column;
justify-content:center;
align-items:flex-start;
padding:0 10%;
}

/* TITULO */
.brand{
font-family:'Roboto';
font-weight:700;
font-style:italic;
font-size:48px;
opacity:0;
transform:translateY(40px);
animation:fadeUp 1s ease forwards;
}

.sub{
font-size:20px;margin-top:5px;
opacity:0;
animation:fadeUp 1s ease forwards .2s;
}

.hero p{
margin-top:10px;
opacity:0;
animation:fadeUp 1s ease forwards .4s;
}

@keyframes fadeUp{
to{opacity:1;transform:translateY(0);}
}

/* BOTONES */
.btn, .contact-buttons a{
margin-top:20px;
display:inline-block;
padding:8px 16px;
font-size:13px;
letter-spacing:.5px;
text-decoration:none;
color:#fff;
border:1px solid rgba(255,255,255,0.4);
border-radius:999px;
background:transparent;
transition:.3s;
position:relative;
overflow:hidden;
}

.btn::before, .contact-buttons a::before{
content:"";
position:absolute;
top:0;left:-100%;
width:100%;height:100%;
background:linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
transition:0.6s;
}

.btn:hover::before, .contact-buttons a:hover::before{
left:100%;
}

.btn:hover, .contact-buttons a:hover{
background:#fff;
color:#000;
}

/* SECTIONS */
section{padding:100px 10%;}

/* SCROLL PRO */
.reveal{
opacity:0;
transform:translateY(120px) scale(.95);
filter:blur(14px);
transition:all 1.4s cubic-bezier(0.16,1,0.3,1);
}
.reveal.active{
opacity:1;
transform:translateY(0) scale(1);
filter:blur(0);
}

/* SERVICES */
.services-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
margin-top:30px;
}
.service-box{
border:1px solid rgba(255,255,255,0.12);
padding:25px;
background:rgba(255,255,255,0.02);
transition:.5s;
}
.service-box:hover{
transform:translateY(-12px);
border-color:#fff;
}

/* ABOUT */
.about{display:flex;flex-wrap:wrap;gap:40px;align-items:center;}
.about img{width:100%;max-width:400px;}
.about-text{max-width:600px;}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:10px;
}
.gallery img{
width:100%;height:260px;object-fit:cover;
transition:.5s;
}
.gallery img:hover{transform:scale(1.05);}

/* PORTFOLIO */
.portfolio iframe{
width:100%;
height:280px;
margin-bottom:25px;
border:none;
transition:.4s;
}
.portfolio iframe:hover{
transform:scale(1.02);
}

/* CONTACT */
.contact{text-align:center;}
.contact-buttons{
margin-top:30px;
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
}

/* DIRECCIÓN CREATIVA PRO */
.creative-wrap{
display:flex;
justify-content:center;
gap:40px;
margin-top:60px;
}

.circle{
width:110px;
height:110px;
border-radius:50%;
overflow:hidden;
border:1px solid rgba(255,255,255,0.3);
transition:.4s;
}

.circle img{
width:100%;
height:100%;
object-fit:cover;
}

.circle:hover{
transform:scale(1.1);
border-color:#fff;
}

.creative{
text-align:center;
font-size:11px;
opacity:.4;
margin-top:20px;
letter-spacing:1px;
}

/* MOBILE */
@media(max-width:768px){
.hero iframe{width:100vw;height:56.25vw;}
.brand{font-size:32px;}
.about{flex-direction:column;}
section{padding:70px 8%;}
}
</style>
</head>

<body>

<div class="loader">
<img src="https://i.ibb.co/FLhbXwjp/MED-COLOR-BLANCO.png">
</div>

<div class="cursor"></div>

<nav>
<img src="https://i.ibb.co/FLhbXwjp/MED-COLOR-BLANCO.png" class="logo">
<div>
<a href="#about">Nosotros</a>
<a href="#services">Servicios</a>
<a href="#portfolio">Portafolio</a>
<a href="#contact">Contacto</a>
</div>
</nav>

<section class="hero">
<iframe src="https://player.vimeo.com/video/1183887876#t=40s&background=1&autoplay=1&loop=1&muted=1"></iframe>
<div class="overlay"></div>

<div class="hero-content">
<div class="brand">Pantera.Creative</div>
<div class="sub">Productora audiovisual</div>
<p>Contenido con intención, estética e impacto</p>
<a href="#portfolio" class="btn">Ver portafolio</a>
</div>
</section>

<!-- TODO TU CONTENIDO ORIGINAL SIGUE EXACTO -->
<!-- (SERVICES, ABOUT, GALLERY, PORTFOLIO SIN CAMBIOS) -->

<!-- CONTACT -->
<section id="contact" class="contact reveal">
<h2>Contacto</h2>

<div class="contact-buttons">
<a href="mailto:juanbiazp95@gmail.com">Correo</a>
<a href="https://wa.me/573026206880" target="_blank">WhatsApp</a>
<a href="#">Instagram</a>
</div>

<!-- NUEVO: DIRECCIÓN CREATIVA -->
<div class="creative-wrap">
<div class="circle"><img src=""></div>
<div class="circle"><img src=""></div>
</div>

<div class="creative">Dirección creativa / Pantera Creative</div>

</section>

<script>
// LOADER
window.addEventListener("load",()=>{
setTimeout(()=>document.querySelector(".loader").classList.add("hidden"),1200);
});

// SCROLL REVEAL
const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add('active');
}
});
},{threshold:0.15});
document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));

// CURSOR SMOOTH
const cursor=document.querySelector('.cursor');
let x=0,y=0;

window.addEventListener('mousemove',e=>{
x=e.clientX;
y=e.clientY;
});

function loop(){
cursor.style.left=x+"px";
cursor.style.top=y+"px";
requestAnimationFrame(loop);
}
loop();

// HOVER
document.querySelectorAll('a, .btn').forEach(el=>{
el.addEventListener('mouseenter',()=>cursor.classList.add('hover'));
el.addEventListener('mouseleave',()=>cursor.classList.remove('hover'));
});

// SONIDO
const clickSound=new Audio("https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3");
document.querySelectorAll("a").forEach(btn=>{
btn.addEventListener("click",()=>{
clickSound.volume=0.15;
clickSound.currentTime=0;
clickSound.play();
});
});
</script>

</body>
</html>
