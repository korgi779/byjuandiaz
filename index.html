<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productora</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{background:#000;color:#fff;cursor:none;}
html{scroll-behavior:smooth;}

/* CURSOR PRO */
.cursor{
width:14px;height:14px;
border:1px solid #fff;
border-radius:50%;
position:fixed;
top:0;left:0;
pointer-events:none;
transform:translate(-50%,-50%);
transition:transform 0.1s ease, width 0.2s, height 0.2s;
z-index:2000;
}

.cursor.hover{
width:40px;height:40px;
background:rgba(255,255,255,0.1);
}

/* NAV */
nav{
position:fixed;width:100%;top:0;
padding:15px 40px;
display:flex;justify-content:space-between;align-items:center;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
z-index:1000;
}

.logo{height:30px;}

nav a{
color:#fff;margin-left:20px;text-decoration:none;
opacity:0.9;transition:0.3s;
}
nav a:hover{opacity:0.6;}

/* HERO */
.hero{height:70vh;position:relative;overflow:hidden;}

.hero iframe{
position:absolute;top:50%;left:50%;
width:177.77vh;height:100vh;
transform:translate(-50%,-50%);
pointer-events:none;
}

.overlay{
position:absolute;inset:0;
background:rgba(0,0,0,0.45);
z-index:1;
}

.hero-content{
position:relative;z-index:2;height:100%;
display:flex;flex-direction:column;
justify-content:center;
align-items:flex-start;
padding:0 10%;
}

.brand{
font-family:'Roboto', sans-serif;
font-weight:700;
font-style:italic;
font-size:48px;
}

.sub{font-size:20px;margin-top:5px;opacity:0.85;}
.hero p{margin-top:10px;opacity:0.75;}

/* BOTON PRO */
.btn{
margin-top:20px;
display:inline-block;
padding:10px 18px;
font-size:13px;
letter-spacing:0.5px;
text-decoration:none;
color:#fff;
border:1px solid rgba(255,255,255,0.5);
border-radius:999px;
background:transparent;
transition:all 0.3s ease;
position:relative;
overflow:hidden;
}

.btn::before{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
transition:0.6s;
}

.btn:hover::before{left:100%;}
.btn:hover{
background:#fff;color:#000;border-color:#fff;
transform:translateY(-2px);
box-shadow:0 10px 25px rgba(255,255,255,0.15);
}

/* SECTIONS */
section{
padding:100px 10%;
transition:opacity 0.6s ease, transform 0.6s ease;
}

/* REVEAL */
.reveal{
opacity:0;
transform:translateY(60px) scale(0.98);
filter:blur(10px);
transition:all 1.2s cubic-bezier(0.16,1,0.3,1);
}
.reveal.active{
opacity:1;
transform:translateY(0) scale(1);
filter:blur(0);
}

/* SERVICES */
.services-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
margin-top:30px;
}

.service-box{
border:1px solid rgba(255,255,255,0.15);
padding:25px;
background:rgba(255,255,255,0.03);
backdrop-filter:blur(6px);
transition:0.4s;
}
.service-box:hover{
transform:translateY(-8px);
border-color:#fff;
background:rgba(255,255,255,0.06);
}

/* ABOUT */
.about{display:flex;flex-wrap:wrap;gap:40px;align-items:center;}
.about img{width:100%;max-width:400px;}
.about-text{max-width:600px;}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:10px;
}
.gallery img{
width:100%;height:260px;object-fit:cover;
transition:0.4s;cursor:pointer;
}
.gallery img:hover{
transform:scale(1.05);
opacity:0.85;
}

/* PORTFOLIO */
.portfolio iframe{
width:100%;height:280px;margin-bottom:25px;border:none;
transition:0.4s;
filter:brightness(0.9);
}
.portfolio iframe:hover{
filter:brightness(1);
transform:scale(1.02);
}

/* CONTACT */
.contact{text-align:center;}
.contact-buttons{
margin-top:30px;
display:flex;justify-content:center;gap:15px;flex-wrap:wrap;
}
.contact-buttons a{
border:1px solid #fff;
padding:10px 18px;
text-decoration:none;color:#fff;font-size:14px;
transition:.3s;
}
.contact-buttons a:hover{
background:#fff;color:#000;
}

/* MOBILE */
@media(max-width:768px){
.hero iframe{width:100vw;height:56.25vw;}
.brand{font-size:32px;}
.about{flex-direction:column;}
section{padding:70px 8%;}
.cursor{display:none;}
}
</style>
</head>

<body>

<div class="cursor"></div>

<nav>
<img src="https://i.ibb.co/FLhbXwjp/MED-COLOR-BLANCO.png" class="logo">
<div>
<a href="#about">Nosotros</a>
<a href="#services">Servicios</a>
<a href="#portfolio">Portafolio</a>
<a href="#contact">Contacto</a>
</div>
</nav>

<section class="hero">
<iframe src="https://player.vimeo.com/video/1183887876?background=1&autoplay=1&loop=1&muted=1#t=40s"></iframe>
<div class="overlay"></div>

<div class="hero-content">
<div class="brand reveal">Pantera.Creative</div>
<div class="sub reveal">Productora audiovisual</div>
<p class="reveal">Contenido con intención, estética e impacto</p>
<a href="#portfolio" class="btn reveal">Ver portafolio</a>
</div>
</section>

<section id="services">
<h2 class="reveal">Servicios</h2>
<div class="services-grid">
<div class="service-box reveal">...</div>
</div>
</section>

<section id="about" class="about reveal">
<img src="https://i.ibb.co/DgMfWBqN/IMG-0508.jpg">
<div class="about-text">
<h2>Sobre nosotros</h2>
<p>(Este texto lo editas tú luego)</p>
</div>
</section>

<section class="reveal">
<div class="gallery">
<img src="https://i.ibb.co/d0P2QtJB/IMG-5758.jpg">
<img src="https://i.ibb.co/1GfjNGt5/IMG-5755.jpg">
<img src="https://i.ibb.co/GvyDWjHK/IMG-3531.jpg">
<img src="https://i.ibb.co/xSKhH4Sq/IMG-3535.jpg">
<img src="https://i.ibb.co/99M8xfyt/IMG-9481.jpg">
<img src="https://i.ibb.co/mVwk9nrm/IMG-9972.jpg">
</div>
</section>

<section id="portfolio" class="portfolio reveal">
<h2>Portafolio</h2>

<h3>Videoclips</h3>
<iframe src="https://player.vimeo.com/video/1183887876"></iframe>
<iframe src="https://player.vimeo.com/video/1062974250"></iframe>
<iframe src="https://player.vimeo.com/video/1062971665"></iframe>
<iframe src="https://player.vimeo.com/video/1034642854"></iframe>

<h3>Eventos</h3>
<iframe src="https://player.vimeo.com/video/1032576795"></iframe>

<h3>Marcas</h3>
<iframe src="https://player.vimeo.com/video/1183939530"></iframe>
</section>

<section id="contact" class="contact reveal">
<h2>Contacto</h2>
<div class="contact-buttons">
<a href="mailto:juanbiazp95@gmail.com">Correo</a>
<a href="https://wa.me/573026206880" target="_blank">WhatsApp</a>
<a href="#">Instagram</a>
</div>
</section>

<script>
/* REVEAL */
const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add('active');
}
});
},{threshold:0.15});
document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));

/* CURSOR */
const cursor=document.querySelector('.cursor');

document.addEventListener('mousemove',e=>{
cursor.style.top=e.clientY+'px';
cursor.style.left=e.clientX+'px';
});

document.querySelectorAll('a, button, iframe').forEach(el=>{
el.addEventListener('mouseenter',()=>cursor.classList.add('hover'));
el.addEventListener('mouseleave',()=>cursor.classList.remove('hover'));
});
</script>

</body>
</html>
