<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productora</title>

<!-- ROBOTO -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#000;
color:#fff;
}

html{
scroll-behavior:smooth;
}

/* NAV */
nav{
position:fixed;
width:100%;
top:0;
padding:15px 40px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
z-index:1000;
}

/* LOGO ANIMADO */
.logo{
height:30px;
object-fit:contain;
opacity:0;
animation:fadeLogo 1.5s ease forwards;
}

@keyframes fadeLogo{
to{opacity:1;}
}

nav a{
color:#fff;
margin-left:20px;
text-decoration:none;
}

/* HERO */
.hero{
height:70vh;
position:relative;
overflow:hidden;
}

.hero iframe{
position:absolute;
top:50%;
left:50%;
width:177.77vh;
height:100vh;
transform:translate(-50%,-50%);
pointer-events:none;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,0.45);
z-index:1;
}

.hero-content{
position:relative;
z-index:2;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
padding:0 10%;
}

/* TITULO PRINCIPAL */
.brand-name{
font-family:'Roboto', sans-serif;
font-weight:700;
font-style:italic;
font-size:48px;
letter-spacing:2px;
opacity:0;
transform:translateY(20px);
animation:fadeUp 1.2s ease forwards;
}

/* SUBTITULO */
.hero h2{
font-size:28px;
margin-top:10px;
opacity:0;
transform:translateY(20px);
animation:fadeUp 1.2s ease forwards;
animation-delay:0.3s;
}

/* TEXTO */
.hero p{
margin-top:10px;
opacity:0;
transform:translateY(20px);
animation:fadeUp 1.2s ease forwards;
animation-delay:0.6s;
}

/* BOTON */
.btn{
margin-top:20px;
border:1px solid #fff;
padding:10px 20px;
text-decoration:none;
color:#fff;
width:fit-content;
opacity:0;
transform:translateY(20px);
animation:fadeUp 1.2s ease forwards;
animation-delay:0.9s;
}

/* ANIMACION GENERAL */
@keyframes fadeUp{
to{
opacity:1;
transform:translateY(0);
}
}

/* SECTIONS */
section{
padding:100px 10%;
}

/* SERVICES */
.services-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.service-box{
border:1px solid #333;
padding:25px;
}

/* ABOUT */
.about{
display:flex;
flex-wrap:wrap;
gap:40px;
align-items:center;
}

.about img{
width:100%;
max-width:400px;
object-fit:cover;
}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:10px;
}

.gallery img{
width:100%;
height:260px;
object-fit:cover;
transition: 0.4s ease;
cursor:pointer;
}

.gallery img:hover{
transform: scale(1.05);
opacity: 0.85;
}

/* PORTFOLIO */
.portfolio h2{
text-align:center;
margin-bottom:50px;
}

/* CONTACT */
.contact{
text-align:center;
}

/* MOBILE */
@media(max-width:768px){

.brand-name{
font-size:34px;
}

.hero h2{
font-size:20px;
}

}
</style>
</head>

<body>

<nav>
<img src="https://i.ibb.co/FLhbXwjp/MED-COLOR-BLANCO.png" class="logo">

<div>
<a href="#about">Nosotros</a>
<a href="#services">Servicios</a>
<a href="#portfolio">Portafolio</a>
<a href="#contact">Contacto</a>
</div>
</nav>

<!-- HERO -->
<section class="hero">

<iframe src="https://player.vimeo.com/video/1183887876?background=1&autoplay=1&loop=1&muted=1#t=40s"></iframe>

<div class="overlay"></div>

<div class="hero-content">

<div class="brand-name">Pantera.Creative</div>
<h2>Productora audiovisual</h2>
<p>Contenido con intención, estética y impacto</p>
<a href="#portfolio" class="btn">Ver portafolio</a>

</div>

</section>

</body>
</html>
