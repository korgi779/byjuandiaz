<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productora</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#000;color:#fff;cursor:none;}
html{scroll-behavior:smooth;}

/* LOADER */
.loader{
position:fixed;
inset:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
z-index:3000;
transition:opacity 1s ease;
}
.loader.hidden{opacity:0;pointer-events:none;}
.loader img{
width:120px;
opacity:0;
animation:logoFade 1.5s ease forwards;
}
@keyframes logoFade{
0%{opacity:0;transform:scale(0.8);}
100%{opacity:1;transform:scale(1);}
}

/* CURSOR */
.cursor{
width:18px;height:18px;
border:1px solid #fff;
border-radius:50%;
position:fixed;
pointer-events:none;
transform:translate(-50%,-50%);
transition:transform .15s ease, background .2s;
z-index:2000;
}
.cursor.hover{
transform:translate(-50%,-50%) scale(1.8);
background:rgba(255,255,255,0.15);
}

/* NAV */
nav{
position:fixed;width:100%;top:0;
padding:15px 40px;
display:flex;justify-content:space-between;align-items:center;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
z-index:1000;
}
.logo{height:30px;}

nav a{
color:#fff;margin-left:20px;text-decoration:none;
opacity:0.9;transition:0.3s;
}
nav a:hover{opacity:0.6;}

/* HERO */
.hero{height:70vh;position:relative;overflow:hidden;}
.hero iframe{
position:absolute;top:50%;left:50%;
width:177.77vh;height:100vh;
transform:translate(-50%,-50%);
}
.overlay{
position:absolute;inset:0;
background:rgba(0,0,0,0.45);
z-index:1;
}
.hero-content{
position:relative;z-index:2;height:100%;
display:flex;flex-direction:column;
justify-content:center;
align-items:flex-start;
padding:0 10%;
}

/* TITULO */
.brand{
font-family:'Roboto', sans-serif;
font-weight:700;
font-style:italic;
font-size:48px;
letter-spacing:-1px;
opacity:0;
transform:translateY(40px);
animation:fadeUp 1s ease forwards;
}
.sub{
font-size:20px;margin-top:5px;opacity:0;
animation:fadeUp 1s ease forwards 0.2s;
}
.hero p{
margin-top:10px;opacity:0;
animation:fadeUp 1s ease forwards 0.4s;
}
@keyframes fadeUp{
to{opacity:1;transform:translateY(0);}
}

/* BOTONES */
.btn{
margin-top:20px;
display:inline-block;
padding:8px 16px;
font-size:13px;
text-decoration:none;
color:#fff;
border:1px solid rgba(255,255,255,0.4);
border-radius:999px;
transition:all 0.3s ease;
}
.btn:hover{background:#fff;color:#000;}

/* SECTIONS */
section{padding:100px 10%;}

/* REVEAL */
.reveal{
opacity:0;
transform:translateY(100px);
transition:1s;
}
.reveal.active{
opacity:1;
transform:translateY(0);
}

/* SERVICES */
.services-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
margin-top:30px;
}
.service-box{
border:1px solid rgba(255,255,255,0.15);
padding:25px;
background:rgba(255,255,255,0.03);
transition:0.4s;
}
.service-box:hover{
transform:translateY(-10px);
border-color:#fff;
}

/* ABOUT */
.about{display:flex;flex-wrap:wrap;gap:40px;align-items:center;}
.about img{width:100%;max-width:400px;}
.about-text{max-width:600px;}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:10px;
}
.gallery img{
width:100%;height:260px;object-fit:cover;
transition:0.4s;
}
.gallery img:hover{transform:scale(1.05);}

/* PORTFOLIO */
.portfolio iframe{
width:100%;
height:280px;
margin-bottom:25px;
border:none;
transition:.4s;
}
.portfolio iframe:hover{transform:scale(1.02);}

/* CONTACT */
.contact{text-align:center;}
.contact-buttons{
margin-top:30px;
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}
.contact-buttons a{
padding:8px 14px;
border:1px solid rgba(255,255,255,0.4);
border-radius:999px;
text-decoration:none;
color:#fff;
font-size:13px;
transition:.3s;
}
.contact-buttons a:hover{background:#fff;color:#000;}

/* CEOs */
.ceos{
margin-top:40px;
display:flex;
justify-content:center;
gap:60px;
flex-wrap:wrap;
text-align:center;
}
.ceo img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:2px solid rgba(255,255,255,0.3);
}
.ceo p{color:#fff;}

/* NUEVO TITULO */
.ceo-title{
margin-top:60px;
font-size:22px;
letter-spacing:1px;
}

</style>
</head>

<body>

<div class="loader">
<img src="https://i.ibb.co/FLhbXwjp/MED-COLOR-BLANCO.png">
</div>

<div class="cursor"></div>

<nav>
<img src="https://i.ibb.co/FLhbXwjp/MED-COLOR-BLANCO.png" class="logo">
<div>
<a href="#about">Nosotros</a>
<a href="#services">Servicios</a>
<a href="#portfolio">Portafolio</a>
<a href="#contact">Contacto</a>
</div>
</nav>

<section class="hero">
<iframe src="https://player.vimeo.com/video/1183887876?background=1&autoplay=1&loop=1&muted=1#t=40s"></iframe>
<div class="overlay"></div>

<div class="hero-content">
<div class="brand">Pantera.Creative</div>
<div class="sub">Productora audiovisual</div>
<p>Contenido con intención, estética e impacto</p>
<a href="#portfolio" class="btn">Ver portafolio</a>
</div>
</section>

<!-- TODO TU CONTENIDO ORIGINAL SIGUE IGUAL -->

<section id="contact" class="contact reveal">
<h2>Contacto</h2>

<div class="contact-buttons">
<a href="mailto:juanbiazp95@gmail.com">Correo</a>
<a href="https://wa.me/573026206880" target="_blank">WhatsApp</a>
</div>

<h3 class="ceo-title">Dirección Creativa</h3>

<div class="ceos">
<a href="#" class="ceo">
<img src="https://via.placeholder.com/300">
<p>Juan Díaz<br><span>Productor audiovisual</span></p>
</a>

<a href="#" class="ceo">
<img src="https://via.placeholder.com/300">
<p>Diego Ospina<br><span>Productor audiovisual</span></p>
</a>
</div>

</section>

<script>
window.addEventListener("load",()=>{
setTimeout(()=>document.querySelector(".loader").classList.add("hidden"),1200);
});

const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add('active');
}
});
},{threshold:0.15});
document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));

const cursor=document.querySelector('.cursor');
window.addEventListener('mousemove',e=>{
cursor.style.top=e.clientY+'px';
cursor.style.left=e.clientX+'px';
});
</script>

</body>
</html>
