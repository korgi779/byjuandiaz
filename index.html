<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juan Díaz</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0b;
  color: white;
}

/* NAV */
nav {
  position: fixed;
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 20px 40px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  z-index: 1000;
}

/* HERO VIDEO */
.hero {
  height: 100vh;
  overflow: hidden;
  position: relative;
}

.hero iframe {
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.hero-text {
  position: absolute;
  bottom: 60px;
  left: 40px;
}

.hero-text h1 {
  font-size: 4rem;
  margin: 0;
}

.hero-text p {
  opacity: 0.7;
}

/* SECTION */
section {
  padding: 80px 40px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px,1fr));
  gap: 20px;
}

/* VIDEO */
.video iframe {
  width: 100%;
  height: 200px;
  border: none;
  transition: 0.3s;
}

.video:hover iframe {
  transform: scale(1.02);
}

/* TITLES */
h2 {
  font-size: 2.5rem;
  margin-bottom: 20px;
}

/* ANIMACIÓN SCROLL */
.fade {
  opacity: 0;
  transform: translateY(40px);
  transition: 1s;
}

.fade.visible {
  opacity: 1;
  transform: translateY(0);
}
</style>
</head>

<body>

<nav>
  <div><b>JUAN DÍAZ</b></div>
  <div>Portfolio</div>
</nav>

<!-- HERO VIDEO (LOOP) -->
<div class="hero">
  <iframe src="https://player.vimeo.com/video/1183887876?background=1&autoplay=1&loop=1&muted=1"></iframe>

  <div class="hero-text">
    <h1>CREADOR AUDIOVISUAL</h1>
    <p>Videoclips · Marcas · Narrativa</p>
  </div>
</div>

<!-- VIDEOCLIPS -->
<section class="fade">
<h2>Videoclips</h2>

<div class="grid">

<div class="video">
<iframe src="https://player.vimeo.com/video/1183887876"></iframe>
</div>

<div class="video">
<iframe src="https://player.vimeo.com/video/1062974250"></iframe>
</div>

<div class="video">
<iframe src="https://player.vimeo.com/video/1062971665"></iframe>
</div>

<div class="video">
<iframe src="https://player.vimeo.com/video/1034642854"></iframe>
</div>

</div>
</section>

<!-- EVENTOS -->
<section class="fade">
<h2>Eventos</h2>

<div class="grid">
<div class="video">
<iframe src="https://player.vimeo.com/video/1032576795"></iframe>
</div>
</div>
</section>

<!-- MARCAS -->
<section class="fade">
<h2>Marcas</h2>

<div class="grid">
<div class="video">
<iframe src="https://player.vimeo.com/video/1183939530"></iframe>
</div>
</div>
</section>

<!-- ABOUT -->
<section class="fade">
<h2>Sobre mí</h2>
<p>
Soy Juan Díaz, creador audiovisual enfocado en videoclips, contenido de marca y narrativa visual.
Desarrollo piezas que conectan desde la dirección, edición y color.
</p>
</section>

<script>
const faders = document.querySelectorAll('.fade');

window.addEventListener('scroll', () => {
  faders.forEach(el => {
    const top = el.getBoundingClientRect().top;
    if(top < window.innerHeight - 100){
      el.classList.add('visible');
    }
  });
});
</script>

</body>
</html>
