<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Proyecto - Pantera Creative</title>

<style>
body{
background:#000;
color:#fff;
font-family:Arial, sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
padding:20px;
}

.container{
width:100%;
max-width:520px;
}

h1{
font-size:2rem;
margin-bottom:10px;
}

p{
opacity:.6;
margin-bottom:30px;
}

input, textarea, select{
width:100%;
padding:14px;
margin-bottom:15px;
background:#0a0a0a;
border:1px solid #222;
color:#fff;
font-size:14px;
}

textarea{
min-height:100px;
resize:none;
}

button{
width:100%;
padding:16px;
background:#fff;
color:#000;
border:none;
cursor:pointer;
font-weight:bold;
transition:.3s;
}

button:hover{
opacity:.8;
}

.micro{
font-size:12px;
opacity:.5;
margin-top:10px;
}
</style>

</head>

<body>

<div class="container">

<h1>Iniciar proyecto</h1>

<p>
Cuéntanos lo que estás construyendo.  
Si encajamos, te responderemos en menos de 24h.
</p>

<form id="formulario">

<input type="text" id="nombre" placeholder="Nombre" required>

<input type="text" id="marca" placeholder="Marca / Empresa" required>

<input type="text" id="instagram" placeholder="Instagram o web">

<textarea id="proyecto" placeholder="¿Qué necesitas crear?" required></textarea>

<textarea id="idea" placeholder="Referencias, ideas o estilo visual"></textarea>

<select id="presupuesto" required>
<option value="">Presupuesto estimado</option>
<option>$500 - $1.000 USD</option>
<option>$1.000 - $3.000 USD</option>
<option>$3.000 - $10.000 USD</option>
<option>$10.000 USD+</option>
</select>

<button type="submit">Enviar solicitud</button>

<p class="micro">
Trabajamos con un número limitado de proyectos al mes.
</p>

</form>

</div>

<script>
document.getElementById("formulario").addEventListener("submit", function(e){
e.preventDefault();

let nombre = document.getElementById("nombre").value;
let marca = document.getElementById("marca").value;
let instagram = document.getElementById("instagram").value;
let proyecto = document.getElementById("proyecto").value;
let idea = document.getElementById("idea").value;
let presupuesto = document.getElementById("presupuesto").value;

// MENSAJE PRO (IMPORTANTE)
let mensaje = `Hola Pantera Creative, quiero iniciar un proyecto:%0A%0A
👤 Nombre: ${nombre}%0A
🏷 Marca: ${marca}%0A
🌐 Instagram/Web: ${instagram}%0A%0A
🎬 Proyecto:%0A${proyecto}%0A%0A
💡 Referencias:%0A${idea}%0A%0A
💰 Presupuesto: ${presupuesto}`;

// TU WHATSAPP (correcto)
let telefono = "573013331485";

// URL FINAL
let url = `https://wa.me/${telefono}?text=${mensaje}`;

window.open(url, "_blank");
});
</script>

</body>
</html>
