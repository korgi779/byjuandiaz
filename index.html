<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Studio</title>

<!-- 🔥 PERFORMANCE -->
<link rel="preconnect" href="https://player.vimeo.com">
<link rel="preconnect" href="https://i.vimeocdn.com">
<link rel="preconnect" href="https://f.vimeocdn.com">

<style>
/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system, BlinkMacSystemFont, sans-serif;
}

body{
background:#000;
color:#fff;
overflow-x:hidden;
}

/* LOADER REAL */
#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
transition:opacity .6s ease;
}

.loader-text{
font-size:14px;
letter-spacing:3px;
opacity:.6;
}

/* HERO */
.hero{
position:relative;
height:100vh;
overflow:hidden;
}

/* VIDEO */
.video-wrapper{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
z-index:1;
background:#000;
}

.video-wrapper iframe{
width:100%;
height:100%;
border:none;
opacity:0;
transition:opacity 1s ease;
pointer-events:none;
}

/* POSTER (fallback) */
.video-poster{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:1;
}

/* CONTENT */
.hero-content{
position:relative;
z-index:2;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

/* BUTTON PRO */
.btn{
margin-top:20px;
padding:10px 18px;
border:1px solid rgba(255,255,255,0.2);
border-radius:999px;
font-size:12px;
letter-spacing:1px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
transition:.3s;
cursor:pointer;
}

.btn:hover{
background:#fff;
color:#000;
}

/* SERVICES */
.services{
padding:80px 20px;
text-align:center;
}

.services ul{
list-style:none;
}

.services li{
margin:10px 0;
opacity:.7;
}

/* PORTFOLIO */
.portfolio{
padding:80px 20px;
}

.video-item{
position:relative;
margin-bottom:40px;
overflow:hidden;
}

.video-item video{
width:100%;
display:block;
}

/* CURSOR FIX */
.video-item:hover{
cursor:pointer;
}

/* MOBILE FIX */
@media(max-width:768px){

.hero-content h1{
font-size:28px;
}

.btn{
font-size:11px;
padding:8px 14px;
}

/* IMPORTANTE: MOBILE VIDEO FIX */
.video-wrapper iframe{
transform:scale(1.2);
}

}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
<div class="loader-text">LOADING</div>
</div>

<!-- HERO -->
<section class="hero">

<!-- POSTER (carga instantánea) -->
<img class="video-poster" src="https://i.vimeocdn.com/video/placeholder.jpg">

<!-- VIDEO -->
<div class="video-wrapper">
<iframe 
id="vimeoVideo"
src=""
allow="autoplay; fullscreen"
loading="lazy">
</iframe>
</div>

<div class="hero-content">
<h1>Creative Studio</h1>
<button class="btn">VER PORTAFOLIO</button>
</div>

</section>

<!-- SERVICES (RESTAURADO) -->
<section class="services">
<h2>Servicios</h2>
<ul>
<li>Producción audiovisual</li>
<li>Dirección creativa</li>
<li>Edición profesional</li>
<li>Contenido para marcas</li>
<li>Campañas digitales</li>
</ul>
</section>

<!-- PORTFOLIO -->
<section class="portfolio">

<div class="video-item">
<video src="video1.mp4" muted loop playsinline></video>
</div>

<div class="video-item">
<video src="video2.mp4" muted loop playsinline></video>
</div>

</section>

<!-- CONTACT -->
<section class="services">
<button class="btn">CONTACTO</button>
</section>

<script>
/* 🔥 DETECCIÓN DE DISPOSITIVO */
const isMobile = window.innerWidth < 768;

/* 🔥 CARGA DIFERIDA DE VIMEO */
window.addEventListener("load", () => {

const iframe = document.getElementById("vimeoVideo");

/* SOLO cargar video después de que todo esté listo */
setTimeout(()=>{

iframe.src = "https://player.vimeo.com/video/TU_VIDEO_ID?background=1&autoplay=1&loop=1&muted=1";

/* Mostrar video cuando carga */
iframe.onload = () => {
iframe.style.opacity = "1";
};

/* quitar loader REAL */
document.getElementById("loader").style.opacity="0";
setTimeout(()=>{
document.getElementById("loader").style.display="none";
},600);

},500);

});

/* 🔥 AUTOPLAY PORTFOLIO */
document.querySelectorAll("video").forEach(v=>{
v.addEventListener("mouseenter",()=>v.play());
v.addEventListener("mouseleave",()=>v.pause());
});

/* 🔥 MOBILE FIX: autoplay */
if(isMobile){
document.querySelectorAll("video").forEach(v=>{
v.play().catch(()=>{});
});
}
</script>

</body>
</html>
