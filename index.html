<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Vimeo Smooth</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: black;
      overflow-x: hidden;
    }

    /* CONTENEDOR */
    .video-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* IFRAME VIMEO */
    .video-container iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 177.78vh; /* 16:9 ratio */
      height: 100vh;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* OVERLAY OSCURO */
    .video-container::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 1;
    }

    /* TEXTO */
    .video-overlay {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      padding: 20px;
    }

    .video-overlay h1 {
      font-size: 56px;
      font-weight: 600;
      letter-spacing: -1px;
    }

    .video-overlay p {
      margin-top: 10px;
      font-size: 18px;
      opacity: 0.8;
    }

    /* 📱 MOBILE FIX REAL */
    @media (max-width: 768px) {

      .video-container {
        height: 100vh;
      }

      .video-container iframe {
        width: 100vw;
        height: 56.25vw; /* 16:9 */
        min-height: 100vh;
        min-width: 177.78vh;
      }

      .video-overlay h1 {
        font-size: 28px;
        line-height: 1.2;
      }

      .video-overlay p {
        font-size: 14px;
      }
    }

  </style>
</head>

<body>

  <section class="video-container">

    <!-- 🔥 REEMPLAZA SOLO EL ID DEL VIDEO -->
    <iframe 
      src="https://player.vimeo.com/video/VIDEO_ID?background=1&autoplay=1&loop=1&muted=1&controls=0&title=0&byline=0&portrait=0"
      frameborder="0"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>

    <div class="video-overlay">
      <h1>Tu mensaje potente aquí</h1>
      <p>Algo corto, limpio y elegante</p>
    </div>

  </section>

</body>
</html>
